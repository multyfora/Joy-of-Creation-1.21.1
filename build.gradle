plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("**/Depreciated/**")
    exclude("**/* - Converted.gif")
    exclude("**/*.mp3")
    exclude("**/*.zip")
    exclude("src/generated/**/.cache")
}

tasks.named('processResources', Copy).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

repositories {
    maven { url = "https://maven.createmod.net" }
    maven { url = "https://maven.ithundxr.dev/snapshots" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.ryanhcode.dev/releases" }
    maven { url = "https://maven.blamejared.com" }
    maven { url = "https://maven.terraformersmc.com/releases" }
    maven { url = "https://chocolateminecraft.com/maven" }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }


    runs {
        client {
            client()

            jvmArgument '-XX:-UseSuperWord'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()


            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    simulatedExtracted
}

dependencies {
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")
    compileOnly("foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}")

    implementation "maven.modrinth:create-aeronautics:${create_aeronautics_version}"
    implementation "maven.modrinth:sable:${sable_version}"
    implementation("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")

    simulatedExtracted("maven.modrinth:create-aeronautics:${create_aeronautics_version}") { transitive = false }
    compileOnly files(layout.buildDirectory.file("tmp/simulated-jar/dev.simulated_team.simulated.simulated-neoforge-1.21.1-1.3.0.jar"))
    def createthrustersJar = file("run/mods/createthrusters-bundled-V${createthrusters_version}.jar")
    if (createthrustersJar.exists()) {
        compileOnly(files(createthrustersJar))
    }

    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    if (project.findProperty('enableJei') != 'false') {
        localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    }

    compileOnly("dev.emi:emi-neoforge:${emi_version}:api")
    if (project.findProperty('enableEmi') != 'false') {
        localRuntime("dev.emi:emi-neoforge:${emi_version}")
    }

    compileOnly("xaero.minimap:xaerominimap-neoforge-${minecraft_version}:${xaeros_minimap_version}")
    if (project.findProperty('enableXaeros') != 'false') {
        localRuntime("xaero.minimap:xaerominimap-neoforge-${minecraft_version}:${xaeros_minimap_version}")
    }

    compileOnly("xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaeros_worldmap_version}")
    if (project.findProperty('enableXaeros') != 'false') {
        localRuntime("xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaeros_worldmap_version}")
    }
}

def extractSimulatedJar = tasks.register("extractSimulatedJar", Sync) {
    from {
        configurations.simulatedExtracted.collect { jar ->
            zipTree(jar).matching { include "META-INF/jarjar/dev.simulated_team.simulated*.jar" }
        }
    }
    into layout.buildDirectory.dir("tmp/simulated-jar")
    eachFile { fcp -> fcp.relativePath = new RelativePath(!fcp.isDirectory(), fcp.name) }
    includeEmptyDirs = false
}

tasks.named("compileJava") {
    dependsOn(extractSimulatedJar)
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
